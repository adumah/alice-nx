# The CRT's setjmp/longjmp (root keys: they must stay outside any table), found by shape in .text (2026-11-02, before
# the first boot): the only `stfd f14,0(r3)` and the only `lfd f14,0(rX)` in the image, the same jmp_buf layout as
# SA2's and Monster High's CRT pair. Recompiled as plain calls, longjmp would return to its caller with the setjmp
# frame's r1/r31.
#   setjmp  0x82DBA170: hook check (lis r4 / lwz r0,3404(r4) / mtctr / bnectr), mflr r0, mfcr r4, then stfd f14-f31
#           at 0-136(r3), std r13-r31 from 152(r3)
#   longjmp 0x82DBA440: mflr r0, stwu r1,-80(r1), mr r7,r3, val==0 check, then the mirror loads lfd f14.. from 0(r7)
setjmp_address = 0x82DBA170
longjmp_address = 0x82DBA440

